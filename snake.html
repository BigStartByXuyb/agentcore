<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
      user-select: none;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 4px;
      color: #4ade80;
      text-shadow: 0 0 20px #4ade8066;
      margin-bottom: 16px;
    }

    .score-panel {
      display: flex;
      gap: 40px;
      margin-bottom: 16px;
    }

    .score-box {
      text-align: center;
    }

    .score-label {
      font-size: 0.75rem;
      color: #888;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 1.8rem;
      font-weight: bold;
      color: #4ade80;
    }

    #best .score-value {
      color: #facc15;
    }

    canvas {
      border: 2px solid #2a2a4a;
      border-radius: 8px;
      box-shadow: 0 0 40px #4ade8022;
      display: block;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      padding: 10px 28px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 1px;
    }

    #btn-start {
      background: #4ade80;
      color: #0f0f1a;
      font-weight: bold;
    }

    #btn-start:hover { background: #22c55e; }

    #btn-pause {
      background: #2a2a4a;
      color: #a0a0c0;
      border: 1px solid #3a3a6a;
    }

    #btn-pause:hover { background: #3a3a6a; color: #e0e0e0; }

    .hint {
      margin-top: 14px;
      font-size: 0.78rem;
      color: #555;
      letter-spacing: 1px;
    }

    #overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
    }

    #overlay-title {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 20px #000;
    }

    #overlay-sub {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>贪吃蛇</h1>

  <div class="score-panel">
    <div class="score-box" id="current">
      <div class="score-label">得分</div>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div class="score-box" id="best">
      <div class="score-label">最高分</div>
      <div class="score-value" id="best-display">0</div>
    </div>
  </div>

  <div style="position:relative; display:inline-block;">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="overlay">
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-start">开始游戏</button>
    <button id="btn-pause">暂停</button>
  </div>

  <div class="hint">方向键 / WASD 控制 &nbsp;|&nbsp; 空格键 暂停</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const COLS = 20, ROWS = 20;
    const CELL = canvas.width / COLS;

    const scoreEl = document.getElementById('score-display');
    const bestEl = document.getElementById('best-display');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');

    const DIR = { UP: {x:0,y:-1}, DOWN: {x:0,y:1}, LEFT: {x:-1,y:0}, RIGHT: {x:1,y:0} };
    const KEY_MAP = {
      ArrowUp: DIR.UP, ArrowDown: DIR.DOWN, ArrowLeft: DIR.LEFT, ArrowRight: DIR.RIGHT,
      w: DIR.UP, s: DIR.DOWN, a: DIR.LEFT, d: DIR.RIGHT,
      W: DIR.UP, S: DIR.DOWN, A: DIR.LEFT, D: DIR.RIGHT,
    };

    let snake, dir, nextDir, food, score, bestScore, speed, timer, state;
    // state: 'idle' | 'running' | 'paused' | 'dead'

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 },
      ];
      dir = DIR.RIGHT;
      nextDir = DIR.RIGHT;
      score = 0;
      speed = 150;
      spawnFood();
      updateScore();
    }

    function spawnFood() {
      const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied.has(`${pos.x},${pos.y}`));
      food = pos;
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 撞墙
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // 撞自身
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        updateScore();
        spawnFood();
        // 每 5 分加速，最快 60ms
        if (score % 5 === 0 && speed > 60) speed -= 10;
      } else {
        snake.pop();
      }

      draw();
      timer = setTimeout(step, speed);
    }

    function gameOver() {
      state = 'dead';
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('snake_best', bestScore);
        bestEl.textContent = bestScore;
      }
      draw();
      showOverlay('游戏结束', `得分：${score}　点击「开始游戏」重来`);
      btnStart.textContent = '再来一局';
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function showOverlay(title, sub) {
      overlayTitle.textContent = title;
      overlaySub.textContent = sub;
    }

    function hideOverlay() {
      overlayTitle.textContent = '';
      overlaySub.textContent = '';
    }

    // ── 绘制 ──────────────────────────────────────────────

    function draw() {
      // 背景
      ctx.fillStyle = '#12122a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格
      ctx.strokeStyle = '#1e1e3a';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      }
      for (let j = 0; j <= ROWS; j++) {
        ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(canvas.width, j * CELL); ctx.stroke();
      }

      // 食物
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const r = CELL / 2 - 3;
      ctx.beginPath();
      ctx.arc(fx, fy, r, 0, Math.PI * 2);
      ctx.fillStyle = '#f87171';
      ctx.fill();
      ctx.shadowColor = '#f87171';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;

      // 蛇身
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        const g = Math.round(174 - t * 80);
        ctx.fillStyle = i === 0 ? '#86efac' : `rgb(34, ${g}, 74)`;
        const pad = i === 0 ? 1 : 2;
        const radius = i === 0 ? 5 : 3;
        roundRect(ctx, seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, radius);
        ctx.fill();

        // 蛇头眼睛
        if (i === 0) drawEyes(seg);
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawEyes(head) {
      const cx = head.x * CELL + CELL / 2;
      const cy = head.y * CELL + CELL / 2;
      const offset = 4;
      let e1, e2;
      if (dir === DIR.RIGHT)      { e1 = {x: cx+3, y: cy-offset}; e2 = {x: cx+3, y: cy+offset}; }
      else if (dir === DIR.LEFT)  { e1 = {x: cx-3, y: cy-offset}; e2 = {x: cx-3, y: cy+offset}; }
      else if (dir === DIR.UP)    { e1 = {x: cx-offset, y: cy-3}; e2 = {x: cx+offset, y: cy-3}; }
      else                        { e1 = {x: cx-offset, y: cy+3}; e2 = {x: cx+offset, y: cy+3}; }
      [e1, e2].forEach(e => {
        ctx.beginPath(); ctx.arc(e.x, e.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#0f0f1a'; ctx.fill();
      });
    }

    // ── 控制 ──────────────────────────────────────────────

    function startGame() {
      clearTimeout(timer);
      init();
      state = 'running';
      hideOverlay();
      btnStart.textContent = '重新开始';
      btnPause.textContent = '暂停';
      draw();
      timer = setTimeout(step, speed);
    }

    function togglePause() {
      if (state === 'running') {
        state = 'paused';
        clearTimeout(timer);
        btnPause.textContent = '继续';
        showOverlay('已暂停', '按空格键或点击「继续」恢复');
      } else if (state === 'paused') {
        state = 'running';
        btnPause.textContent = '暂停';
        hideOverlay();
        timer = setTimeout(step, speed);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
      const d = KEY_MAP[e.key];
      if (!d) return;
      e.preventDefault();
      // 禁止反向
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
      if (state === 'idle') startGame();
    });

    window.addEventListener('blur', () => {
      if (state === 'running') togglePause();
    });

    btnStart.addEventListener('click', startGame);
    btnPause.addEventListener('click', togglePause);

    // ── 初始化 ────────────────────────────────────────────

    bestScore = parseInt(localStorage.getItem('snake_best') || '0');
    bestEl.textContent = bestScore;
    state = 'idle';
    init();
    draw();
    showOverlay('贪吃蛇', '按方向键或点击「开始游戏」');
  </script>
</body>
</html>
